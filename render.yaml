services:
  - type: web
    name: topic-management-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/departments
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: DB_HOST
        fromDatabase:
          name: topic-management-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: topic-management-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: topic-management-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: topic-management-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: topic-management-db
          property: password
      - key: JWT_SECRET
        sync: false
      - key: SHOW_SQL
        value: "false"
      - key: H2_CONSOLE_ENABLED
        value: "false"
      - key: JAVA_TOOL_OPTIONS
        value: "-Xmx256m -XX:MaxMetaspaceSize=160m -XX:+UseSerialGC -Xss512k"

databases:
  - name: topic-management-db
    plan: free
    region: singapore
    databaseName: topic_management
    user: topic_management
    ipAllowList: []
